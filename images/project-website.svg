<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="coverTitle coverDesc">
  <title id="coverTitle">HNYZ 社团官网项目封面</title>
  <desc id="coverDesc">深色赛博风格封面：网格背景、终端窗口、HNYZ 标题和蓝色代码光效。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#070b11"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.8" cy="0.15" r="0.65">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0.12" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#58a6ff" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glowBlue)"/>
  <rect width="1600" height="900" fill="url(#glowGreen)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.7"/>

  <path d="M0 690H1600" stroke="#58a6ff" stroke-opacity="0.18" stroke-width="1"/>
  <path d="M0 750H1600" stroke="#58a6ff" stroke-opacity="0.08" stroke-width="1"/>

  <g font-family="'Courier New', monospace">
    <text x="92" y="104" fill="#58a6ff" font-size="24" letter-spacing="6">HNYZ // OPEN_SOURCE</text>
    <text x="92" y="264" fill="#e6edf3" font-family="Arial, Helvetica, sans-serif" font-size="168" font-weight="700" letter-spacing="-8">HNYZ</text>
    <text x="96" y="346" fill="#3fb950" font-size="26" letter-spacing="4">CLUB_WEBSITE // 2026</text>
    <text x="96" y="410" fill="#8b949e" font-size="22" letter-spacing="2">HTML · CSS · JAVASCRIPT · GITHUB PAGES</text>

    <g transform="translate(96 486)">
      <rect width="640" height="2" fill="#30363d"/>
      <text x="0" y="48" fill="#8b949e" font-size="20" letter-spacing="1">$ git push origin main</text>
      <text x="0" y="88" fill="#3fb950" font-size="20" letter-spacing="1">→ deployed to ghxiaochi.github.io/club-website</text>
    </g>
  </g>

  <g transform="translate(880 132)">
