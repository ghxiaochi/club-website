    <rect x="34" y="286" width="528" height="92" rx="8" fill="#161b22" stroke="#30363d"/>
    <circle cx="62" cy="320" r="5" fill="#3fb950"/>
    <text x="82" y="326" fill="#8b949e" font-family="'Courier New', monospace" font-size="16">SYSTEM ONLINE / 2 SESSIONS PER WEEK</text>
    <text x="62" y="356" fill="#58a6ff" font-family="'Courier New', monospace" font-size="16">QQ_GROUP: 1098931492</text>
  </g>

  <g filter="url(#softGlow)">
    <path d="M1436 96L1476 136L1436 176" fill="none" stroke="#58a6ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1320 96L1280 136L1320 176" fill="none" stroke="#3fb950" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
