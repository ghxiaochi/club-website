      <text x="76" y="154" fill="#ff7b72">&lt;h1&gt;</text>
      <text x="164" y="154" fill="#e6edf3">BUILD SOMETHING REAL</text>
      <text x="432" y="154" fill="#ff7b72">&lt;/h1&gt;</text>

      <text x="34" y="196" fill="#6e7681">03</text>
      <text x="76" y="196" fill="#3fb950">// build something real</text>

      <text x="34" y="238" fill="#6e7681">04</text>
      <text x="76" y="238" fill="#ff7b72">&lt;/section&gt;</text>
