    <path d="M0 58H596" stroke="#30363d" stroke-width="2"/>
    <circle cx="28" cy="29" r="6" fill="#ff5f56"/>
    <circle cx="50" cy="29" r="6" fill="#ffbd2e"/>
    <circle cx="72" cy="29" r="6" fill="#27c93f"/>
    <text x="100" y="35" fill="#6e7681" font-family="'Courier New', monospace" font-size="16">~/hnyz/index.html</text>

    <g font-family="'Courier New', monospace" font-size="20">
      <text x="34" y="112" fill="#6e7681">01</text>
