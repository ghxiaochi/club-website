<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="HNYZ 衡南一中编程社：把想法，写成代码。">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.55" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#e4f0ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b9d4f2" stroke-width="1" opacity="0.46"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1e3a8a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#page)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1070" cy="80" r="330" fill="url(#glow)"/>
  <circle cx="160" cy="590" r="300" fill="url(#glow)"/>

  <g font-family="Noto Sans CJK SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
    <g transform="translate(78 66)">
      <rect width="44" height="44" rx="11" fill="#fff" stroke="#c7dcf5"/>
      <path d="m18 13-8 9 8 9M26 13l8 9-8 9" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="800" fill="#0f2744" letter-spacing="1">HNYZ</text>
      <text x="60" y="42" font-size="14" fill="#526b89" letter-spacing="3">衡南一中编程社</text>
    </g>

    <text x="82" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#0369a1" letter-spacing="4">HNYZ // 衡南一中 · 学生编程社团</text>
    <text x="78" y="312" font-size="94" font-weight="800" fill="#0f2744" letter-spacing="-4">把想法，</text>
    <text x="78" y="416" font-size="94" font-weight="800" fill="url(#accent)" letter-spacing="-4">写成代码。</text>
    <text x="82" y="480" font-size="24" fill="#526b89">Arduino · 开源项目 · 每周两次，每次一小时</text>

    <g transform="translate(78 525)">
      <rect width="174" height="42" rx="21" fill="#2563eb"/>
      <text x="87" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#fff">加入我们 →</text>
      <text x="202" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#526b89">ghxiaochi.github.io/club-website</text>
    </g>

    <g transform="translate(704 128)" filter="url(#shadow)">
      <rect width="420" height="360" rx="24" fill="#ffffff" stroke="#c7dcf5"/>
      <rect width="420" height="52" rx="24" fill="#f1f7ff"/>
      <rect y="28" width="420" height="24" fill="#f1f7ff"/>
      <circle cx="26" cy="26" r="6" fill="#ff5f56"/>
      <circle cx="46" cy="26" r="6" fill="#ffbd2e"/>
      <circle cx="66" cy="26" r="6" fill="#27c93f"/>
      <text x="88" y="31" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#58718f">~/hnyz/welcome.ino</text>

      <text x="30" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#0369a1">// 第一次点亮 LED</text>
      <text x="30" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0f2744"><tspan fill="#2563eb">void</tspan> setup() {</text>
      <text x="48" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0f2744">pinMode(<tspan fill="#b45309">13</tspan>, OUTPUT);</text>
      <text x="30" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0f2744">}</text>
      <text x="30" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0f2744"><tspan fill="#2563eb">void</tspan> loop() {</text>
      <text x="48" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0f2744">digitalWrite(<tspan fill="#b45309">13</tspan>, HIGH);</text>
      <text x="48" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0f2744">delay(<tspan fill="#b45309">1000</tspan>);</text>
      <text x="30" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0f2744">}</text>

      <circle cx="360" cy="308" r="26" fill="#e0f2fe" stroke="#7dd3fc"/>
      <circle cx="360" cy="308" r="10" fill="#38bdf8"/>
    </g>
  </g>
</svg>
