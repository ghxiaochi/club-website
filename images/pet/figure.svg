<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 620" role="img" aria-label="">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f3ff"/>
    </linearGradient>
    <linearGradient id="body" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12315a"/>
      <stop offset="1" stop-color="#0b2447"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="310" cy="590" rx="148" ry="17" fill="#bfdbfe" opacity="0.55"/>

  <!-- legs -->
  <rect x="250" y="470" width="54" height="92" rx="27" fill="#dbeafe" stroke="#1e3a8a" stroke-width="8"/>
  <rect x="316" y="470" width="54" height="92" rx="27" fill="#dbeafe" stroke="#1e3a8a" stroke-width="8"/>
  <path d="M244 556h66v20c0 10-8 18-18 18h-30c-10 0-18-8-18-18z" fill="#ffffff" stroke="#1e3a8a" stroke-width="8" stroke-linejoin="round"/>
  <path d="M310 556h66v20c0 10-8 18-18 18h-30c-10 0-18-8-18-18z" fill="#ffffff" stroke="#1e3a8a" stroke-width="8" stroke-linejoin="round"/>

  <!-- left arm -->
  <path d="M236 342C205 366 184 397 174 434" fill="none" stroke="#2563eb" stroke-width="46" stroke-linecap="round"/>
  <circle cx="169" cy="451" r="25" fill="#dbeafe" stroke="#1e3a8a" stroke-width="8"/>

  <!-- right arm reaching toward the badge -->
  <path d="M386 340C420 346 456 360 486 379" fill="none" stroke="#2563eb" stroke-width="46" stroke-linecap="round"/>
  <circle cx="501" cy="385" r="25" fill="#dbeafe" stroke="#1e3a8a" stroke-width="8"/>

  <!-- body -->
  <rect x="204" y="298" width="212" height="180" rx="60" fill="url(#body)" stroke="#1e3a8a" stroke-width="8"/>
  <path d="M246 310q64 34 128 0" fill="none" stroke="#bfdbfe" stroke-width="6" stroke-linecap="round" opacity="0.65"/>

  <!-- chest panel -->
  <rect x="252" y="332" width="116" height="94" rx="23" fill="#ffffff" stroke="#1e3a8a" stroke-width="6"/>
  <text x="310" y="397" fill="#2563eb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="40" font-weight="800" text-anchor="middle">&lt;/&gt;</text>
  <circle cx="310" cy="448" r="6" fill="#67e8f9" stroke="#1e3a8a" stroke-width="3"/>

  <!-- head -->
  <rect x="168" y="88" width="264" height="210" rx="78" fill="url(#shell)" stroke="#1e3a8a" stroke-width="8"/>
  <rect x="145" y="158" width="31" height="70" rx="15" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="8"/>
  <rect x="424" y="158" width="31" height="70" rx="15" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="8"/>

  <!-- antenna -->
  <path d="M300 88V57" fill="none" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="300" cy="43" r="17" fill="#60a5fa" stroke="#1e3a8a" stroke-width="8"/>
  <circle cx="295" cy="38" r="4" fill="#ffffff" opacity="0.9"/>

  <!-- visor -->
  <rect x="199" y="123" width="202" height="138" rx="49" fill="url(#screen)" stroke="#1e3a8a" stroke-width="7"/>
  <path d="M236 190q16-18 32 0" fill="none" stroke="#67e8f9" stroke-width="10" stroke-linecap="round"/>
  <path d="M292 190q16-18 32 0" fill="none" stroke="#67e8f9" stroke-width="10" stroke-linecap="round"/>
  <path d="M267 220q33 26 66 0" fill="none" stroke="#67e8f9" stroke-width="8" stroke-linecap="round"/>
  <circle cx="222" cy="216" r="10" fill="#38bdf8" opacity="0.42"/>
  <circle cx="378" cy="216" r="10" fill="#38bdf8" opacity="0.42"/>

  <!-- highlights -->
  <path d="M196 150q20-18 48-22" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
  <path d="M385 346q18 7 34 16" fill="none" stroke="#bfdbfe" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
</svg>
