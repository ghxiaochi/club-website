<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="coverTitle coverDesc">
  <title id="coverTitle">Zaco 猜数字项目封面</title>
  <desc id="coverDesc">深色背景上的 Zaco 猜数字标题、问号卡片和 Arduino 字样。</desc>
  <defs>
    <pattern id="zacoGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#fffdf8" stroke-width="1" opacity=".09"/>
    </pattern>
    <linearGradient id="zacoCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#e9e2d2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="#171813"/>
  <rect width="1200" height="750" fill="url(#zacoGrid)"/>
  <circle cx="1082" cy="92" r="245" fill="#d9ff62"/>
  <circle cx="76" cy="716" r="210" fill="#ff5a36" opacity=".9"/>

  <text x="72" y="92" fill="#d9ff62" font-family="'Courier New', monospace" font-size="19" font-weight="700" letter-spacing="4">PROJECT / 01</text>
  <text x="70" y="326" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="168" font-weight="800" letter-spacing="-8">ZACO</text>
  <text x="70" y="474" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="168" font-weight="800" letter-spacing="-8">GUESS</text>
  <rect x="73" y="520" width="520" height="2" fill="#fffdf8" opacity=".32"/>
  <text x="73" y="560" fill="#fffdf8" font-family="'Courier New', monospace" font-size="18" font-weight="700" letter-spacing="2.4">ARDUINO · C++ · SERIAL</text>
  <text x="73" y="590" fill="#fffdf8" font-family="'Courier New', monospace" font-size="18" letter-spacing="2.4" opacity=".64">GUESS THE NUMBER · LEARN THE LOOP</text>

  <g transform="translate(835 174) rotate(4)">
    <rect width="292" height="388" rx="26" fill="url(#zacoCard)" stroke="#171813" stroke-width="2.5"/>
    <path d="M0 58h292" fill="none" stroke="#171813" stroke-width="2"/>
    <circle cx="30" cy="30" r="6" fill="#ff5a36"/>
    <circle cx="50" cy="30" r="6" fill="#171813" opacity=".22"/>
    <circle cx="70" cy="30" r="6" fill="#171813" opacity=".22"/>
    <text x="220" y="35" fill="#171813" font-family="'Courier New', monospace" font-size="12" opacity=".55">ZACO.INO</text>

    <text x="146" y="206" fill="#171813" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="154" font-weight="800">?</text>
    <rect x="51" y="239" width="190" height="52" rx="26" fill="#171813"/>
    <text x="146" y="272" fill="#d9ff62" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" font-weight="700" letter-spacing="2">GUESS 0—99</text>
    <g fill="#171813">
      <circle cx="98" cy="328" r="9"/>
      <circle cx="146" cy="328" r="9" opacity=".35"/>
      <circle cx="194" cy="328" r="9" opacity=".18"/>
    </g>
  </g>

  <g transform="translate(1006 616) rotate(-4)">
    <rect x="-134" y="-22" width="268" height="44" rx="22" fill="#d9ff62"/>
    <text x="0" y="6" fill="#171813" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="700" letter-spacing="2">OPEN SOURCE</text>
  </g>
