<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="coverTitle coverDesc">
  <title id="coverTitle">fargoyu 个人主页项目封面</title>
  <desc id="coverDesc">深色科技风封面：左侧 FARGO 标题与项目编号，右侧一个浅色个人主页浏览器窗口。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#070b11"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.78" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.1" cy="0.92" r="0.55">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#58a6ff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <linearGradient id="winBody" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eaf1fb"/>
    </linearGradient>
    <linearGradient id="strokeBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="winShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="winClip">
      <rect x="812" y="196" width="652" height="486" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glowBlue)"/>
  <rect width="1600" height="900" fill="url(#glowViolet)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.7"/>

  <!-- 左侧信息 -->
  <g font-family="'Courier New', monospace">
    <text x="92" y="104" fill="#58a6ff" font-size="24" letter-spacing="6">PROJECT_05 // HTML CSS</text>
    <text x="88" y="284" fill="#eaf2ff" font-family="Arial, Helvetica, sans-serif" font-size="188" font-weight="700" letter-spacing="4">FARGO</text>
    <text x="96" y="356" fill="#8b5cf6" font-size="30" letter-spacing="6">PERSONAL HOMEPAGE</text>
    <text x="96" y="414" fill="#9db8d8" font-size="21" letter-spacing="1">about   ·   works   ·   notes   ·   contact</text>

    <g fill="#8fa9c8" font-size="19" letter-spacing="1">
      <text x="96" y="560">单页作品集 / 浅色卡片 / 无框架</text>
      <text x="96" y="596">手写 HTML + CSS，GitHub Pages 托管</text>
    </g>

    <g>
      <circle cx="102" cy="666" r="6" fill="#3fb950"/>
      <text x="122" y="673" fill="#c8dcf5" font-size="19" letter-spacing="2">fargoyu.github.io</text>
    </g>
  </g>

  <!-- 右侧浏览器窗口 -->
  <g filter="url(#winShadow)">
    <rect x="812" y="196" width="652" height="486" rx="18" fill="url(#winBody)"/>
    <rect x="812" y="196" width="652" height="486" rx="18" fill="none" stroke="url(#strokeBlue)" stroke-width="2"/>
  </g>

  <g clip-path="url(#winClip)">
    <!-- 窗口标题栏 -->
    <rect x="812" y="196" width="652" height="58" fill="#e4edf9"/>
    <circle cx="848" cy="225" r="7" fill="#ff6b6b" opacity="0.85"/>
    <circle cx="874" cy="225" r="7" fill="#ffd93d" opacity="0.85"/>
    <circle cx="900" cy="225" r="7" fill="#4ade80" opacity="0.85"/>
    <rect x="936" y="210" width="300" height="30" rx="15" fill="#ffffff" stroke="#d7e3f4"/>
    <text x="956" y="231" fill="#5b7290" font-family="'Courier New', monospace" font-size="16" letter-spacing="1">fargoyu.github.io</text>

    <!-- 页面内容 -->
    <text x="852" y="330" fill="#8296b0" font-family="'Courier New', monospace" font-size="15" letter-spacing="4">HELLO, I AM</text>
    <text x="848" y="400" fill="#16233a" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" letter-spacing="1">Fargo Yu</text>
    <text x="852" y="438" fill="#4b6a8f" font-family="'Courier New', monospace" font-size="17" letter-spacing="2">student · builder · pixel art</text>

    <!-- 三张小卡 -->
    <g>
      <rect x="850" y="474" width="182" height="132" rx="12" fill="#ffffff" stroke="#dbe6f5"/>
      <rect x="868" y="494" width="54" height="8" rx="4" fill="#bfd3ea"/>
      <rect x="868" y="512" width="130" height="8" rx="4" fill="#e2ebf7"/>
      <rect x="868" y="530" width="104" height="8" rx="4" fill="#e2ebf7"/>
      <rect x="868" y="562" width="70" height="22" rx="11" fill="#e8f0fc"/>

      <rect x="1048" y="474" width="182" height="132" rx="12" fill="#ffffff" stroke="#dbe6f5"/>
      <rect x="1066" y="494" width="76" height="8" rx="4" fill="#bfd3ea"/>
      <rect x="1066" y="512" width="130" height="8" rx="4" fill="#e2ebf7"/>
      <rect x="1066" y="530" width="88" height="8" rx="4" fill="#e2ebf7"/>
      <rect x="1066" y="562" width="58" height="22" rx="11" fill="#f1e9fe"/>

      <rect x="1246" y="474" width="182" height="132" rx="12" fill="#ffffff" stroke="#dbe6f5"/>
      <rect x="1264" y="494" width="62" height="8" rx="4" fill="#bfd3ea"/>
      <rect x="1264" y="512" width="126" height="8" rx="4" fill="#e2ebf7"/>
      <rect x="1264" y="530" width="96" height="8" rx="4" fill="#e2ebf7"/>
      <rect x="1264" y="562" width="76" height="22" rx="11" fill="#e6f7ef"/>
    </g>

    <rect x="812" y="640" width="652" height="42" fill="#eef4fc"/>
  </g>

  <!-- 边角标记 -->
  <g stroke="#58a6ff" stroke-opacity="0.5" stroke-width="2" fill="none">
    <path d="M92 782h56M92 782v-56" stroke-linecap="round"/>
    <path d="M1508 782h-56M1508 782v-56" stroke-linecap="round"/>
  </g>
</svg>
