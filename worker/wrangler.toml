#:schema node_modules/wrangler/config-schema.json
name = "hnyz-dino-ladder"
main = "ladder.js"
compatibility_date = "2025-01-01"

# 站点是公开的，默认放开跨域。想收紧就把下面这行的注释去掉，
# 只允许自己的域名提交（顺便挡住别人拿你的 Worker 当免费接口）。
# [vars]
# ALLOW_ORIGIN = "https://hnyzbcs.de5.net"

# KV 命名空间：先跑
#   npx wrangler kv namespace create LADDER
# 把输出里的 id 填到下面。binding 必须叫 LADDER，代码里写死了这个名字。
[[kv_namespaces]]
binding = "LADDER"
id = "在这里填 wrangler 输出的 id"

[observability]
enabled = true
